<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Aryan Sharma hero card">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131d"/><stop offset="1" stop-color="#08090d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter></defs>
    <style>
    text{font-family:'Jost',Arial,sans-serif} .mono{font-family:'Syne Mono',monospace}
    .muted{fill:#a3a6b8} .white{fill:#f5f6ff} .accent{fill:#8b7cff}
    
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
    .enter{opacity:1;animation:rise .85s cubic-bezier(.2,.75,.25,1) 0.00s both}
    .glow{animation:glow 4s ease-in-out 0.70s infinite}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important} animate{display:none}}
    
    </style>
    <rect x="1" y="1" width="898" height="238" rx="24" fill="url(#bg)" stroke="#292b3b"/>
    <circle class="glow" cx="850" cy="20" r="90" fill="#8b7cff" opacity=".13" filter="url(#blur)"/>
    <g class="enter"><text x="48" y="56" class="mono accent" font-size="13" letter-spacing="3">HELLO, WORLD / I'M</text>
    <text x="44" y="128" class="white" font-size="58" font-weight="700">Aryan Sharma</text>
    <text x="48" y="166" class="muted" font-size="18">BCA student · Full-stack developer · Building thoughtful web experiences</text>
    <text x="48" y="205" class="mono" fill="#06b6d4" font-size="12">INDIA  ·  OPEN TO BUILDING COOL THINGS</text>
    </g><circle cx="820" cy="54" r="3" fill="#06b6d4"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle></svg>
