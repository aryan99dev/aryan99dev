<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Prism featured repository">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131d"/><stop offset="1" stop-color="#08090d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter></defs>
    <style>
    text{font-family:'Jost',Arial,sans-serif} .mono{font-family:'Syne Mono',monospace}
    .muted{fill:#a3a6b8} .white{fill:#f5f6ff} .accent{fill:#8b7cff}
    
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
    .enter{opacity:1;animation:rise .85s cubic-bezier(.2,.75,.25,1) 1.95s both}
    .glow{animation:glow 4s ease-in-out 2.65s infinite}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important} animate{display:none}}
    
    </style>
    <rect x="1" y="1" width="898" height="148" rx="24" fill="url(#bg)" stroke="#292b3b"/>
    <circle class="glow" cx="850" cy="20" r="90" fill="#8b7cff" opacity=".13" filter="url(#blur)"/>
    <a href="https://github.com/aryan99dev/Prism"><g class="enter">
    <text x="32" y="38" class="mono accent" font-size="11" letter-spacing="2">FEATURED REPOSITORY / 02</text>
    <text x="32" y="79" class="white" font-size="28" font-weight="700">Prism</text>
    <text x="32" y="105" class="muted" font-size="14">A real-time social platform with profiles, feeds and Appwrite-powered auth.</text>
    <text x="32" y="130" fill="#06b6d4" class="mono" font-size="11">React · TypeScript · Appwrite</text>
    <text x="850" y="82" text-anchor="middle" class="accent" font-size="24">↗</text>
    </g></a></svg>
