<svg xmlns="http://www.w3.org/2000/svg" width="300" height="330" viewBox="0 0 300 330" role="img" aria-label="LEARN tile">
<style>.serif{font-family:'Instrument Serif',Georgia,serif;}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Monaco,Consolas,monospace;}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-6px)}}@keyframes arrowShift{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}@keyframes arrowDiag{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.35}}@keyframes pop{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes radar{0%{r:4.5px;opacity:0.85}100%{r:14px;opacity:0}}@keyframes scanner{0%{transform:translateX(0px);opacity:0}15%{opacity:0.35}85%{opacity:0.35}100%{transform:translateX(820px);opacity:0}}@keyframes lightBeamWide{0%{transform:translateX(0px)}35%,100%{transform:translateX(1510px)}}@keyframes lightBeamTile{0%{transform:translateX(0px)}35%,100%{transform:translateX(620px)}}@keyframes auraGlow{0%,100%{opacity:0.02;transform:scale(1)}50%{opacity:0.055;transform:scale(1.05)}}@keyframes peakBreathe{0%,100%{opacity:1}50%{opacity:0.65}}.enter{animation:enter .75s cubic-bezier(.16,1,.3,1) both}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.16,1,.3,1) both}.avatar-float{transform-box:fill-box;transform-origin:50% 50%;animation:float 4.2s ease-in-out infinite}.arrow-shift{display:inline-block;animation:arrowShift 2.2s ease-in-out infinite}.arrow-diag{display:inline-block;animation:arrowDiag 2.2s ease-in-out infinite}.pulse{animation:pulseDot 2.4s ease-in-out infinite}.pill-pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.16,1,.3,1) both}.cursor{animation:blink 0.8s step-end infinite}.aura{transform-box:fill-box;transform-origin:50% 50%;animation:auraGlow 4.2s ease-in-out infinite}.radar-ping{transform-box:fill-box;transform-origin:50% 50%;animation:radar 2.4s cubic-bezier(.16,1,.3,1) infinite}.beam-wide{animation:lightBeamWide 6.2s ease-in-out infinite}.beam-tile{animation:lightBeamTile 5.2s ease-in-out infinite}.scanner-line{animation:scanner 6s ease-in-out infinite}.peak-pulse{animation:peakBreathe 3s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} animate,animateTransform{display:none!important} .type-clip{width:100%!important}}</style>
<rect width="300" height="330" rx="26" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
<defs>
<clipPath id="tile-2-shine-clip"><rect width="300" height="330" rx="26"/></clipPath>
<linearGradient id="tile-2-shine-shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#09090b" stop-opacity="0"/>
<stop offset="35%" stop-color="#09090b" stop-opacity="0.015"/>
<stop offset="50%" stop-color="#09090b" stop-opacity="0.055"/>
<stop offset="65%" stop-color="#09090b" stop-opacity="0.015"/>
<stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
</linearGradient>
</defs>
<g clip-path="url(#tile-2-shine-clip)">
<g class="beam-tile" style="animation-delay:1.60s">
<animateTransform attributeName="transform" type="translate" values="0,0; 620,0; 620,0" keyTimes="0; 0.35; 1" dur="5.2s" begin="1.6s" repeatCount="indefinite"/>
<rect x="-140" y="-40" width="100" height="450" fill="url(#tile-2-shine-shine)" transform="skewX(-22)"/>
</g>
</g>
<g class="enter" style="animation-delay:0.49s"><text x="28" y="44" class="mono" font-size="12" font-weight="600" letter-spacing="2" fill="#09090b" opacity="0.95">LEARN</text>
<g class="arrow-shift"><animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="2.2s" repeatCount="indefinite"/><text x="272" y="44" class="sans" font-size="18" font-weight="bold" text-anchor="end" fill="#09090b">&#x2192;</text></g>
<text x="26" y="156" class="serif" font-size="48" fill="#09090b">BCA <tspan font-style="italic">'26</tspan></text>
<text x="28" y="214" class="sans" font-size="14" fill="#27272a" opacity="0.95">Shoolini University, India.</text>
<text x="28" y="238" class="sans" font-size="14" fill="#27272a" opacity="0.95">Exploring web architecture &amp; full-stack.</text>
</g>
</svg>
