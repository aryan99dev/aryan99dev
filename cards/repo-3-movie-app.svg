<svg xmlns="http://www.w3.org/2000/svg" width="900" height="158" viewBox="0 0 900 158" role="img" aria-label="Movie-App — featured repository"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1a"/><stop offset="1" stop-color="#09090b"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#312e81"/><stop offset=".5" stop-color="#8b7cff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="32"/></filter><clipPath id="card"><rect width="900" height="158" rx="20"/></clipPath></defs><style>text{font-family:Jost,"Segoe UI",Arial,sans-serif}.mono{font-family:"Syne Mono","SFMono-Regular",Consolas,monospace}.t{fill:#f4f4ff}.m{fill:#a1a1b5}.p{fill:#8b7cff}.c{fill:#06b6d4}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pulse{0%,100%{opacity:.28}50%{opacity:.70}}@keyframes blink{0%,100%{opacity:.18}50%{opacity:1}}@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}.enter{animation:rise .80s cubic-bezier(.2,.75,.25,1) both}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .90s cubic-bezier(.2,.75,.25,1) both}.pulse{animation:pulse 4s ease-in-out infinite}.blink{animation:blink 2.8s ease-in-out infinite}.wipe{transform-origin:left center;animation:wipe .6s ease both}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}animate{display:none}}</style><g clip-path="url(#card)"><rect width="900" height="158" fill="url(#bg)"/><circle class="pulse" cx="840" cy="10" r="80" fill="#8b7cff" opacity=".22" filter="url(#glow)"/><circle cx="30" cy="158" r="60" fill="#06b6d4" opacity=".07" filter="url(#glow)"/></g><rect x=".5" y=".5" width="899" height="157" rx="20" fill="none" stroke="#1e1c3a" stroke-width="1"/><g class="enter" style="animation-delay:2.16s"><text x="32" y="38" class="mono p" font-size="11" letter-spacing="2">FEATURED REPOSITORY / 03</text><text x="32" y="82" class="t" font-size="30" font-weight="700">Movie-App</text><rect x="32.0" y="92.0" width="48.0" height="2.5" rx="1.25" fill="url(#ac)" class="wipe" style="animation-delay:2.26s"/><text x="32" y="116" class="m" font-size="14">Movie discovery app — search, details, responsive card grid.</text><text x="32" y="138" class="mono c" font-size="11" letter-spacing="1">React · Vite</text><path d="M850 78 L860 68 M850.5 68 H860 V77.5" fill="none" stroke="#8b7cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
