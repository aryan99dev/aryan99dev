<svg xmlns="http://www.w3.org/2000/svg" width="300" height="330" viewBox="0 0 300 330" role="img" aria-label="BRAND tile">
<style>.serif{font-family:'Instrument Serif',Georgia,serif;}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Monaco,Consolas,monospace;}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.enter{animation:enter .75s cubic-bezier(.16,1,.3,1) both}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.16,1,.3,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} animate{display:none}}</style>
<rect width="300" height="330" rx="26" fill="#18181b" stroke="#18181b" stroke-width="1"/>
<g class="enter" style="animation-delay:0.37s"><text x="28" y="44" class="mono" font-size="12" font-weight="600" letter-spacing="2" fill="#ffffff" opacity="0.95">BRAND</text>
<text x="272" y="44" class="sans" font-size="18" font-weight="bold" text-anchor="end" fill="#ffffff">&#x2192;</text>
<text x="26" y="156" class="serif" font-size="48" fill="#ffffff">10+ <tspan font-style="italic">repos</tspan></text>
<text x="28" y="214" class="sans" font-size="14" fill="#ffffff" opacity="0.95">Open source contributions and experiments.</text>
<text x="28" y="238" class="sans" font-size="14" fill="#ffffff" opacity="0.95">Active development, animations &amp; UI.</text>
</g>
</svg>
