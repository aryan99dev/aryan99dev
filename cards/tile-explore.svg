<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="132" viewBox="0 0 300 132" role="img" aria-label="EXPLORE">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131d"/><stop offset="1" stop-color="#08090d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter></defs>
    <style>
    text{font-family:'Jost',Arial,sans-serif} .mono{font-family:'Syne Mono',monospace}
    .muted{fill:#a3a6b8} .white{fill:#f5f6ff} .accent{fill:#8b7cff}
    
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
    .enter{opacity:1;animation:rise .85s cubic-bezier(.2,.75,.25,1) 0.35s both}
    .glow{animation:glow 4s ease-in-out 1.05s infinite}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important} animate{display:none}}
    
    </style>
    <rect x="1" y="1" width="298" height="130" rx="24" fill="url(#bg)" stroke="#292b3b"/>
    <circle class="glow" cx="250" cy="20" r="90" fill="#8b7cff" opacity=".13" filter="url(#blur)"/>
    <a href="https://github.com/aryan99dev?tab=repositories"><g class="enter">
    <text x="22" y="32" class="mono accent" font-size="11" letter-spacing="2">02 / LEARN</text>
    <text x="22" y="73" class="white" font-size="25" font-weight="700">EXPLORE</text>
    <text x="22" y="101" class="muted" font-size="12">Projects &amp; open source</text>
    <text x="270" y="34" class="mono" fill="#06b6d4" font-size="12">02 ↗</text>
    </g></a></svg>
