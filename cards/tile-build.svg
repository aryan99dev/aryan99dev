<svg xmlns="http://www.w3.org/2000/svg" width="300" height="330" viewBox="0 0 300 330" role="img" aria-label="BUILD tile">
<style>.serif{font-family:'Instrument Serif',Georgia,serif;}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Monaco,Consolas,monospace;}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-6px)}}@keyframes arrowShift{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}@keyframes arrowDiag{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.35}}@keyframes pop{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}.enter{animation:enter .75s cubic-bezier(.16,1,.3,1) both}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.16,1,.3,1) both}.avatar-float{transform-box:fill-box;transform-origin:50% 50%;animation:float 4.2s ease-in-out infinite}.arrow-shift{display:inline-block;animation:arrowShift 2.2s ease-in-out infinite}.arrow-diag{display:inline-block;animation:arrowDiag 2.2s ease-in-out infinite}.pulse{animation:pulseDot 2.4s ease-in-out infinite}.pill-pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.16,1,.3,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} animate,animateTransform{display:none!important}}</style>
<rect width="300" height="330" rx="26" fill="#09090b" stroke="#09090b" stroke-width="1"/>
<g class="enter" style="animation-delay:0.25s"><text x="28" y="44" class="mono" font-size="12" font-weight="600" letter-spacing="2" fill="#ffffff" opacity="0.95">BUILD</text>
<g class="arrow-shift"><animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="2.2s" repeatCount="indefinite"/><text x="272" y="44" class="sans" font-size="18" font-weight="bold" text-anchor="end" fill="#ffffff">&#x2192;</text></g>
<text x="26" y="156" class="serif" font-size="48" fill="#ffffff">3 <tspan font-style="italic">projects</tspan></text>
<text x="28" y="214" class="sans" font-size="14" fill="#ffffff" opacity="0.95">Portfolio, Prism and Movie-App.</text>
<text x="28" y="238" class="sans" font-size="14" fill="#ffffff" opacity="0.95">Built with Next.js, React &amp; TypeScript.</text>
</g>
</svg>
