<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-label="Contribution analytics">
<style>.serif{font-family:'Instrument Serif',Georgia,serif;}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Monaco,Consolas,monospace;}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-6px)}}@keyframes arrowShift{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}@keyframes arrowDiag{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.35}}@keyframes pop{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes radar{0%{r:4.5px;opacity:0.85}100%{r:14px;opacity:0}}@keyframes scanner{0%{transform:translateX(0px);opacity:0}15%{opacity:0.35}85%{opacity:0.35}100%{transform:translateX(820px);opacity:0}}@keyframes lightBeam{0%{transform:translateX(-120px) skewX(-20deg)}35%,100%{transform:translateX(450px) skewX(-20deg)}}@keyframes auraGlow{0%,100%{opacity:0.02;transform:scale(1)}50%{opacity:0.055;transform:scale(1.05)}}@keyframes peakBreathe{0%,100%{opacity:1}50%{opacity:0.65}}.enter{animation:enter .75s cubic-bezier(.16,1,.3,1) both}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.16,1,.3,1) both}.avatar-float{transform-box:fill-box;transform-origin:50% 50%;animation:float 4.2s ease-in-out infinite}.arrow-shift{display:inline-block;animation:arrowShift 2.2s ease-in-out infinite}.arrow-diag{display:inline-block;animation:arrowDiag 2.2s ease-in-out infinite}.pulse{animation:pulseDot 2.4s ease-in-out infinite}.pill-pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s cubic-bezier(.16,1,.3,1) both}.cursor{animation:blink 0.8s step-end infinite}.aura{transform-box:fill-box;transform-origin:50% 50%;animation:auraGlow 4.2s ease-in-out infinite}.radar-ping{transform-box:fill-box;transform-origin:50% 50%;animation:radar 2.4s cubic-bezier(.16,1,.3,1) infinite}.beam{animation:lightBeam 5s ease-in-out infinite}.scanner-line{animation:scanner 6s ease-in-out infinite}.peak-pulse{animation:peakBreathe 3s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} animate,animateTransform{display:none!important} .type-clip{width:100%!important}}</style>
<rect width="920" height="320" rx="28" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
<g class="enter" style="animation-delay:0.65s"><circle cx="52" cy="42" r="4" fill="#09090b" class="pulse"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="52" cy="42" r="4" fill="none" stroke="#09090b" stroke-width="1.2" opacity="0.8" class="radar-ping"><animate attributeName="r" values="4;12;4" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="66" y="46" class="mono" font-size="11" font-weight="600" letter-spacing="2" fill="#71717a">CONTRIBUTION PULSE</text>
<text x="46" y="86" class="serif" font-size="36" fill="#09090b">Activity <tspan font-style="italic">Dashboard</tspan></text>
<defs>
<clipPath id="sub-clip"><rect class="type-clip" x="48" y="96" width="0" height="20"><animate attributeName="width" from="0" to="480" dur="1.3s" begin="0.75s" fill="freeze" calcMode="linear"/></rect></clipPath>
</defs>
<g clip-path="url(#sub-clip)"><text x="48" y="108" class="sans" font-size="13" fill="#3f3f46">Real GitHub activity across the last 12 calendar months</text></g>
<rect x="442" y="98" width="6" height="12" rx="1" fill="#71717a" class="cursor"><animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="0.75s" repeatCount="indefinite"/></rect>
<g class="pill-pop" style="animation-delay:0.75s"><rect x="520" y="44" width="118" height="52" rx="14" fill="#f4f4f5"/>
<text x="536" y="67" class="sans" font-size="18" font-weight="bold" fill="#09090b">1</text>
<text x="536" y="84" class="mono" font-size="9" font-weight="600" letter-spacing="1" fill="#09090b">DAY STREAK</text>
</g><g class="pill-pop" style="animation-delay:0.87s"><rect x="646" y="44" width="118" height="52" rx="14" fill="#09090b"/>
<text x="662" y="67" class="sans" font-size="18" font-weight="bold" fill="#ffffff">10</text>
<text x="662" y="84" class="mono" font-size="9" font-weight="600" letter-spacing="1" fill="#ffffff">ACTIVE DAYS</text>
</g><g class="pill-pop" style="animation-delay:0.99s"><rect x="772" y="44" width="118" height="52" rx="14" fill="#f4f4f5"/>
<text x="788" y="67" class="sans" font-size="18" font-weight="bold" fill="#09090b">Thursday</text>
<text x="788" y="84" class="mono" font-size="9" font-weight="600" letter-spacing="1" fill="#09090b">BUSIEST</text>
</g><line x1="48" y1="268" x2="872" y2="268" stroke="#e4e4e7" stroke-width="1"/>
<rect x="48.0" y="264.0" width="57.7" height="4.0" rx="6" fill="#f4f4f5"/>
<text x="76.8" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Dec</text>
<rect x="117.7" y="264.0" width="57.7" height="4.0" rx="6" fill="#f4f4f5"/>
<text x="146.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Jan</text>
<rect x="187.3" y="189.2" width="57.7" height="78.8" rx="6" fill="#09090b"/>
<rect class="bar" x="187.3" y="268" width="57.7" height="0" rx="6" fill="#09090b">
<animate attributeName="height" from="0" to="78.8" dur=".65s" begin="0.95s" fill="freeze"/>
<animate attributeName="y" from="268" to="189.2" dur=".65s" begin="0.95s" fill="freeze"/>
</rect>
<text x="216.2" y="183.2" text-anchor="middle" class="sans" opacity="0" font-size="11" font-weight="600" fill="#09090b">5<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="1.40s" fill="freeze"/></text>
<text x="216.2" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Feb</text>
<rect x="257.0" y="264.0" width="57.7" height="4.0" rx="6" fill="#f4f4f5"/>
<text x="285.8" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Mar</text>
<rect x="326.7" y="264.0" width="57.7" height="4.0" rx="6" fill="#f4f4f5"/>
<text x="355.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Apr</text>
<rect x="396.3" y="264.0" width="57.7" height="4.0" rx="6" fill="#f4f4f5"/>
<text x="425.2" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">May</text>
<rect x="466.0" y="205.0" width="57.7" height="63.0" rx="6" fill="#09090b"/>
<rect class="bar" x="466.0" y="268" width="57.7" height="0" rx="6" fill="#09090b">
<animate attributeName="height" from="0" to="63.0" dur=".65s" begin="1.15s" fill="freeze"/>
<animate attributeName="y" from="268" to="205.0" dur=".65s" begin="1.15s" fill="freeze"/>
</rect>
<text x="494.8" y="199.0" text-anchor="middle" class="sans" opacity="0" font-size="11" font-weight="600" fill="#09090b">4<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="1.60s" fill="freeze"/></text>
<text x="494.8" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Jun</text>
<rect x="535.7" y="236.5" width="57.7" height="31.5" rx="6" fill="#09090b"/>
<rect class="bar" x="535.7" y="268" width="57.7" height="0" rx="6" fill="#09090b">
<animate attributeName="height" from="0" to="31.5" dur=".65s" begin="1.20s" fill="freeze"/>
<animate attributeName="y" from="268" to="236.5" dur=".65s" begin="1.20s" fill="freeze"/>
</rect>
<text x="564.5" y="230.5" text-anchor="middle" class="sans" opacity="0" font-size="11" font-weight="600" fill="#09090b">2<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="1.65s" fill="freeze"/></text>
<text x="564.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Jul</text>
<rect x="605.3" y="264.0" width="57.7" height="4.0" rx="6" fill="#f4f4f5"/>
<text x="634.2" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Aug</text>
<rect x="675.0" y="220.8" width="57.7" height="47.2" rx="6" fill="#09090b"/>
<rect class="bar" x="675.0" y="268" width="57.7" height="0" rx="6" fill="#09090b">
<animate attributeName="height" from="0" to="47.2" dur=".65s" begin="1.30s" fill="freeze"/>
<animate attributeName="y" from="268" to="220.8" dur=".65s" begin="1.30s" fill="freeze"/>
</rect>
<text x="703.8" y="214.8" text-anchor="middle" class="sans" opacity="0" font-size="11" font-weight="600" fill="#09090b">3<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="1.75s" fill="freeze"/></text>
<text x="703.8" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Sep</text>
<rect x="744.7" y="157.8" width="57.7" height="110.2" rx="6" fill="#09090b"/>
<rect class="bar" x="744.7" y="268" width="57.7" height="0" rx="6" fill="#09090b">
<animate attributeName="height" from="0" to="110.2" dur=".65s" begin="1.35s" fill="freeze"/>
<animate attributeName="y" from="268" to="157.8" dur=".65s" begin="1.35s" fill="freeze"/>
</rect>
<text x="773.5" y="151.8" text-anchor="middle" class="sans" opacity="0" font-size="11" font-weight="600" fill="#09090b">7<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="1.80s" fill="freeze"/></text>
<text x="773.5" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Oct</text>
<rect x="814.3" y="142.0" width="57.7" height="126.0" rx="6" fill="#09090b"/>
<rect class="bar peak-pulse" x="814.3" y="268" width="57.7" height="0" rx="6" fill="#09090b">
<animate attributeName="height" from="0" to="126.0" dur=".65s" begin="1.40s" fill="freeze"/>
<animate attributeName="y" from="268" to="142.0" dur=".65s" begin="1.40s" fill="freeze"/>
<animate attributeName="opacity" values="1;0.65;1" dur="2.8s" begin="2.10s" repeatCount="indefinite"/></rect>
<text x="843.2" y="136.0" text-anchor="middle" class="sans" opacity="0" font-size="11" font-weight="600" fill="#09090b">8<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="1.85s" fill="freeze"/></text>
<text x="843.2" y="286" text-anchor="middle" class="mono" font-size="11" fill="#71717a">Nov</text>
<text x="48" y="304" class="mono" font-size="11" fill="#71717a">29 contributions in the last 12 months  ·  Dec 2025 – Nov 2026</text>
</g>
</svg>
