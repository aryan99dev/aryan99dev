<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Contribution activity by month">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131d"/><stop offset="1" stop-color="#08090d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter></defs>
    <style>
    text{font-family:'Jost',Arial,sans-serif} .mono{font-family:'Syne Mono',monospace}
    .muted{fill:#a3a6b8} .white{fill:#f5f6ff} .accent{fill:#8b7cff}
    
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
    .enter{opacity:1;animation:rise .85s cubic-bezier(.2,.75,.25,1) 0.85s both}
    .glow{animation:glow 4s ease-in-out 1.55s infinite}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important} animate{display:none}}
    
    </style>
    <rect x="1" y="1" width="898" height="288" rx="24" fill="url(#bg)" stroke="#292b3b"/>
    <circle class="glow" cx="850" cy="20" r="90" fill="#8b7cff" opacity=".13" filter="url(#blur)"/>
    <g class="enter"><text x="34" y="43" class="white" font-size="23" font-weight="700">CONTRIBUTION PULSE</text><text x="34" y="67" class="muted" font-size="12">A year of showing up, one commit at a time.</text><text x="500" y="42" class="accent" font-size="24" font-weight="700">1</text><text x="500" y="62" class="muted mono" font-size="9">DAY STREAK</text><text x="625" y="42" class="accent" font-size="24" font-weight="700">10</text><text x="625" y="62" class="muted mono" font-size="9">ACTIVE DAYS</text><text x="750" y="42" class="accent" font-size="24" font-weight="700">THURSDAY</text><text x="750" y="62" class="muted mono" font-size="9">BUSIEST DAY</text><line x1="42" y1="230" x2="858" y2="230" stroke="#303247"/><rect x="42.0" y="227.0" width="52.4" height="3.0" rx="5" fill="url(#accent)" opacity=".9"/><rect x="42.0" y="230" width="52.4" height="0" rx="5" fill="url(#accent)"><animate attributeName="height" from="0" to="3.0" dur=".8s" begin="1.10s" fill="freeze"/><animate attributeName="y" from="230" to="227.0" dur=".8s" begin="1.10s" fill="freeze"/></rect><text x="68.2" y="250" text-anchor="middle" class="muted mono" font-size="10">Dec</text><rect x="111.4" y="227.0" width="52.4" height="3.0" rx="5" fill="url(#accent)" opacity=".9"/><rect x="111.4" y="230" width="52.4" height="0" rx="5" fill="url(#accent)"><animate attributeName="height" from="0" to="3.0" dur=".8s" begin="1.16s" fill="freeze"/><animate attributeName="y" from="230" to="227.0" dur=".8s" begin="1.16s" fill="freeze"/></rect><text x="137.6" y="250" text-anchor="middle" class="muted mono" font-size="10">Jan</text><rect x="180.8" y="151.9" width="52.4" height="78.1" rx="5" fill="url(#accent)" opacity=".9"/><rect x="180.8" y="230" width="52.4" height="0" rx="5" fill="url(#accent)"><animate attributeName="height" from="0" to="78.1" dur=".8s" begin="1.21s" fill="freeze"/><animate attributeName="y" from="230" to="151.9" dur=".8s" begin="1.21s" fill="freeze"/></rect><text x="207.0" y="250" text-anchor="middl