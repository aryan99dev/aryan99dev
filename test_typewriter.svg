<svg xmlns='http://www.w3.org/2000/svg' width='500' height='100'>
<style>
@keyframes typing { from { width: 0; } to { width: 300px; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.type-clip { animation: typing 2.5s steps(35, end) forwards; }
.cursor { animation: blink 0.8s step-end infinite; }
</style>
<clipPath id='type-clip'><rect class='type-clip' x='20' y='20' width='0' height='30'/></clipPath>
<g clip-path='url(#type-clip)'>
  <text x='20' y='40' font-family='monospace' font-size='16' fill='#000'>I build modern web apps, learn new tech</text>
</g>
</svg>