<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Aryan Sharma — Profile Cards Preview</title><style>body{background:#09090b;margin:0;padding:24px;font-family:-apple-system,sans-serif;color:#e4e4e7}.toolbar{max-width:920px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;background:#18181b;padding:12px 20px;border-radius:14px;border:1px solid #27272a}.btn{background:#27272a;color:#fff;border:1px solid #3f3f46;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s}.btn:hover{background:#3f3f46}.btn.active{background:#fff;color:#000;border-color:#fff}.w{max-width:920px;margin:auto;display:flex;flex-wrap:wrap;gap:14px}img{width:100%;display:block;border-radius:28px}img[src*="tile-"]{width:calc(33.333% - 10px)}</style></head><body><div class="toolbar"><div><strong>Preview Mode:</strong> <span id="mode-label">Live Animated (cards/)</span></div><div style="display:flex;gap:10px;"><button class="btn" onclick="replay()">&#x21bb; Replay Animations</button><button class="btn active" id="btn-anim" onclick="setMode('cards')">Live Animated</button><button class="btn" id="btn-static" onclick="setMode('cards-static')">Static Frame</button></div></div><div class="w" id="container"><img src="cards/hero.svg" alt="hero.svg"><img src="cards/tile-build.svg" alt="tile-build.svg"><img src="cards/tile-explore.svg" alt="tile-explore.svg"><img src="cards/tile-connect.svg" alt="tile-connect.svg"><img src="cards/contributions.svg" alt="contributions.svg"><img src="cards/repo-1-portfolio.svg" alt="repo-1-portfolio.svg"><img src="cards/repo-2-prism.svg" alt="repo-2-prism.svg"><img src="cards/repo-3-movie-app.svg" alt="repo-3-movie-app.svg"><img src="cards/contribution-graph.svg" alt="contribution-graph.svg"></div><script>function setMode(dir){document.querySelectorAll("#container img").forEach(img=>{const name=img.src.split("/").pop().split("?")[0];img.src=dir+"/"+name+"?t="+Date.now();});document.getElementById("btn-anim").classList.toggle("active",dir==="cards");document.getElementById("btn-static").classList.toggle("active",dir==="cards-static");document.getElementById("mode-label").textContent=dir==="cards"?"Live Animated (cards/)":"Static Frame (cards-static/)";}function replay(){document.querySelectorAll("#container img").forEach(img=>{const src=img.src.split("?")[0];img.src=src+"?t="+Date.now();});}</script></body></html>
