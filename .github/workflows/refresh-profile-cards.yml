name: Refresh animated profile cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font subsetting tools
        run: python -m pip install --upgrade fonttools brotli

      - name: Fetch contribution calendar and render SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_cards.py --refresh-contributions

      - name: Verify fonts were embedded
        run: grep -q "@font-face" cards/hero.svg || echo "::warning::No embedded fonts found in cards/hero.svg (Google Fonts fetch or pyftsubset failed)"

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards/ contribution-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          else
            echo "No card changes to commit."
          fi
